<text x="100" y="1945" font-size="25" font-weight="bold">Relationship key · parent [multiplicity] → child [multiplicity]</text>
<text x="100" y="1980" font-size="18">R1: Society [1] → Household [0..*]</text>
<text x="100" y="2013" font-size="18">R2: Society [1] → TankerBooking [0..*]</text>
<text x="100" y="2046" font-size="18">R3: Supplier [1] → TankerBooking [0..*]</text>
<text x="100" y="2079" font-size="18">R4: TankerBooking [1] → Delivery [0..1]</text>
<text x="100" y="2112" font-size="18">R5: Society [1] → BillingPeriod [0..*]</text>
<text x="100" y="2145" font-size="18">R6: Delivery [1] → SupplierInvoice [0..1]</text>
<text x="100" y="2178" font-size="18">R7: SupplierInvoice [1] → SupplierPayment [0..*]</text>
<text x="1100" y="1980" font-size="18">R8: BillingPeriod [1] → Bill [0..*]</text>
<text x="1100" y="2013" font-size="18">R9: Household [1] → Bill [0..*]</text>
<text x="1100" y="2046" font-size="18">R10: Bill [1] → Payment [0..*]</text>
<text x="1100" y="2079" font-size="18">R11: Delivery [1] → WaterAllocation [0..*]</text>
<text x="1100" y="2112" font-size="18">R12: Household [1] → WaterAllocation [0..*]</text>
<text x="1100" y="2145" font-size="18">R13: Society [1] → User [0..*]</text>
<text x="1100" y="2178" font-size="18">R14: Household [0..1] → User [0..*]</text>
<text x="100" y="2230" font-size="18">Composite FKs: Bill(period, society) → BillingPeriod; Bill(household, society) → Household;</text>
<text x="100" y="2258" font-size="18">User(household, society) → Household. Exact column names and composite unique keys: docs/er-diagram.md.</text>
<text x="100" y="2295" font-size="18">Supplier invoices feed monthly expense calculation through GenerateMonthlyBills; no direct invoice-to-period FK exists.</text>
<text x="100" y="2325" font-size="18">Views (not tables): HouseholdBalance, SupplierInvoiceBalance. PKs auto-increment. SQL is unchanged.</text>
